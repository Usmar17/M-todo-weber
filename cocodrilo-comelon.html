const TOTAL=15;const NAME_KEYS=['weber_nombre_alumno','nombreAlumno','nombre_alumno','alumnoNombre','studentName','student_name','nombre','alumno','playerName','jugador','nombreJugador'];let questions=[],index=0,correct=0,mistakes=0,started=0,answers=[],name='';const $=id=>document.getElementById(id);const choiceButtons=[...document.querySelectorAll('.choice')];function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.85;u.pitch=1.12;speechSynthesis.speak(u)}function generate(){let q=[],used=new Set();for(let i=0;i<TOTAL;i++){let a,b,key;do{a=Math.floor(Math.random()*21);b=Math.floor(Math.random()*21);key=`${a},${b}`}while(a===b||used.has(key)||(i>0&&i%2===0&&q[i-1].a===a));used.add(key);q.push({a,b,sign:a>b?'>':'<'})} // Equilibrar respuestas y mezclar.
let greater=q.filter(x=>x.sign==='>').length;if(greater<6||greater>9){let desired=7;for(let i=0;i<q.length&&greater!==desired;i++){let x=q[i];if((greater>desired&&x.sign==='>')||(greater<desired&&x.sign==='<')){[x.a,x.b]=[x.b,x.a];x.sign=x.a>x.b?'>':'<';greater+=x.sign==='>'?1:-1}}}return q}
function show(){const q=questions[index];$('dropzone').innerHTML='?';$('dropzone').classList.remove('placed');$('round').textContent=`Reto ${index+1} de ${TOTAL}`;$('score').textContent=`⭐ ${correct} aciertos`;$('fill').style.width=`${index/TOTAL*100}%`;$('left').textContent=q.a;$('right').textContent=q.b;$('message').textContent='';$('message').classList.remove('bad','good');choiceButtons.forEach(b=>b.disabled=false);setTimeout(()=>say(`¿Cuál es el mayor? ${q.a} o ${q.b}.`),250)}
function start(){document.documentElement.requestFullscreen?.().catch(()=>{});name=$('student').value.trim();if(!name){$('student').focus();say('Primero escribe tu nombre');return}try{localStorage.setItem('nombreAlumno',name);localStorage.setItem('nombre_alumno',name);localStorage.setItem('weber_nombre_alumno',name)}catch(e){}questions=generate();index=0;correct=0;mistakes=0;answers=[];started=Date.now();$('intro').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');show()}
function respond(sign){if(choiceButtons.every(b=>b.disabled))return;const img=choiceButtons.find(b=>b.dataset.sign===sign)?.querySelector('img');$('dropzone').innerHTML='';if(img){const clone=img.cloneNode(true);clone.alt=img.alt;$('dropzone').appendChild(clone)}$('dropzone').classList.add('placed');const q=questions[index];choiceButtons.forEach(b=>b.disabled=true);const ok=sign===q.sign;const mark=document.createElement('span');mark.className='answer-mark '+(ok?'good':'bad');mark.textContent=ok?'✓':'✕';mark.setAttribute('aria-label',ok?'Correcto':'Incorrecto');$('dropzone').appendChild(mark);if(ok)correct++;else mistakes++;answers.push({ejercicio:index+1,numero_izquierdo:q.a,numero_derecho:q.b,respuesta:sign,correcta:q.sign,acierto:ok});$('message').classList.toggle('bad',!ok);$('message').classList.toggle('good',ok);$('message').textContent=ok?'🌟 ¡Muy bien!':'❌ Te equivocaste';say(ok?'¡Muy bien!':'Te equivocaste');setTimeout(()=>{index++;if(index===TOTAL)finish();else show()},1250)}
function finish(){speechSynthesis.cancel();$('game').classList.add('hidden');$('end').classList.remove('hidden');$('fill').style.width='100%';const seconds=Math.round((Date.now()-started)/1000),percentage=Math.round(correct/TOTAL*100);$('stars').textContent=correct>=13?'⭐⭐⭐':correct>=9?'⭐⭐':'⭐';$('result').textContent=`${name}: ${correct} de ${TOTAL} aciertos`;$('detail').textContent=`${percentage}% de aciertos · ${mistakes} errores · ${Math.floor(seconds/60)} min ${seconds%60} s`;say(`¡Felicidades ${name}! Terminaste el juego con ${correct} respuestas correctas de 15.`);send({alumno:name,nombre:name,juego:'Cocodrilo comelón - Mayor y menor que',actividad:'Cocodrilo comelón - Mayor y menor que',intentos:TOTAL,duracion:seconds,idPartida:'cocodrilo-'+Date.now(),fecha:new Date().toISOString(),aciertos:correct,errores:mistakes,porcentaje:percentage,tiempo_segundos:seconds,respuestas:JSON.stringify(answers)})}
async function send(data){if(!SHEETS_WEB_APP_URL){$('sendStatus').textContent='¡Excelente esfuerzo! Sigue aprendiendo y jugando.';return} $('sendStatus').textContent='¡Excelente esfuerzo! Sigue aprendiendo y jugando.';try{await fetch(SHEETS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});$('sendStatus').textContent='¡Excelente esfuerzo! Sigue aprendiendo y jugando.'}catch(e){$('sendStatus').textContent='¡Excelente esfuerzo! Sigue aprendiendo y jugando.'}}
try{for(const key of NAME_KEYS){const saved=localStorage.getItem(key);if(saved&&saved.trim()){ $('student').value=saved.trim();break}}}catch(e){} $('start').onclick=start;$('again').onclick=()=>{questions=generate();index=0;correct=0;mistakes=0;answers=[];started=Date.now();$('end').classList.add('hidden');$('game').classList.remove('hidden');show()};$('exit').onclick=()=>{speechSynthesis.cancel();if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});$('end').classList.add('hidden');$('intro').classList.remove('hidden');$('student').value=name;window.scrollTo?.(0,0)};$('hear').onclick=()=>{const q=questions[index];say(`¿Cuál es el mayor? ${q.a} o ${q.b}`)};choiceButtons.forEach(b=>b.onclick=()=>respond(b.dataset.sign));$('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
