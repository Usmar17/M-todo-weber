$('exit').onclick=()=>{started=false;phase='wait';try{speechSynthesis.cancel()}catch(e){}try{if(audioCtx&&audioCtx.state==='running')audioCtx.suspend()}catch(e){}const salir=document.exitFullscreen||document.webkitExitFullscreen;if(document.fullscreenElement&&salir){try{const p=salir.call(document);if(p&&p.catch)p.catch(()=>{})}catch(e){}}$('end').hidden=true;$('hud').hidden=true;$('start').hidden=false;};$('play').onclick=iniciarEnPantallaCompleta;$('again').onclick=iniciarEnPantallaCompleta;$('repeat').onclick=()=>{if(started&&phase==='play')speak(words[answer])};c.addEventListener('pointerdown',e=>{initAudio();if(!started||phase!=='play')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;for(let i=items.length-1;i>=0;i--){let b=items[i];if(!b.dead&&Math.abs(x-b.x)<65*b.s&&Math.abs(y-b.y)<36*b.s){pop(b);return}}});function next(){round++;if(round===10){guardarResultado($('name').value.trim()||'Explorador',score);started=false;$('hud').hidden=true;$('end').hidden=false;$('result').textContent=`${$('name').value.trim()||'Explorador'}, conseguiste ${score} de 10 cajas. ¡Excelente viaje!`;return}spawn()}
let wagonLast=null;function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;t+=dt;world+=dt*(started?(phase==='exit'?420:phase==='enter'?65:95):40);ctx.clearRect(0,0,W,H);scenery();if(started){wheelAngle+=(phase==='exit'?10:phase==='enter'?4.5:2.9)*dt;ambientTick(dt);for(const b of items){if(!b.dead){b.x-=dt*b.speed;b.y+=Math.sin(t*1.25+b.phase)*dt*5;if(b.x< -95)b.x=W+110;drawBlimp(b)}}}if(started){if(phase==='enter'){if(!announced){announced=true;speak(words[answer]);sfxChuchu()}const goal=W*.53;trainVelocity+=(W*1.15-trainVelocity)*Math.min(1,dt*2.4);trainX+=dt*trainVelocity;if(trainX>=goal){trainX=goal;trainVelocity=W*.035;phase='play'}}else if(phase==='play'||phase==='wrong'||phase==='drop'||phase==='miss'){/* El tren avanza suavemente sin saltar de un borde a otro. El escenario se desplaza. */trainVelocity=W*.035;trainX+=dt*trainVelocity;if(trainX>W*.67){trainX=W*.67;trainVelocity=0}}else if(phase==='exit'){trainSpeed+=dt*W*.9;trainX+=trainSpeed*dt;if(trainX>W+575*clamp(W/420,1.02,1.85)){next()}}else if(phase==='success'&&t>=nextAt){phase='exit';trainSpeed=W*.36}}const wagon=drawTrain();wagonLast=wagon;drawSmoke(dt,wagon);if(started){if(drop){const half=16*clamp(W/540,.7,1);if(!drop.landed){const oldY=drop.y;drop.v+=dt*620;drop.y+=drop.v*dt;drop.angle+=dt*.45;
// La caja debe atravesar la boca del vagón; se comprueba su posición en el instante de cruzar el borde.
const rimY=wagon.y+Math.max(2,wagon.scale*3);const left=wagon.x+4*wagon.scale,right=wagon.x+wagon.w-4*wagon.scale;
// Comprobar la intersección física de la caja con la boca del vagón en el instante del cruce.
if(!crateResolved&&oldY+half<=rimY&&drop.y+half>=rimY){crateResolved=true;const overlap=Math.max(0,Math.min(drop.x+half,right)-Math.max(drop.x-half,left));if(overlap>=half*.75){drop.y=wagon.y+12*wagon.scale;drop.angle=0;drop.landed=true;successDrop()}else{failedDrop()}}
if(!crateResolved&&drop.y>H*.89){crateResolved=true;failedDrop()}}
if(drop.landed){drop.x=wagon.x+crateOffsetX;drop.y=wagon.y+crateOffsetY;drop.angle=0}
if(drop.landed){const sc=wagon.scale;ctx.save();ctx.beginPath();ctx.rect(wagon.x+3*sc,wagon.y-15*sc,wagon.w-6*sc,43*sc);ctx.clip();drawCrate(drop.x,drop.y,clamp(W/540,.7,1),drop.num,0);ctx.restore();/* El borde frontal oculta la mitad inferior: la caja se ve alojada dentro. */rounded(wagon.x+8*sc,wagon.y+27*sc,wagon.w-16*sc,24*sc,3*sc,'#314b80');text(words[answer],wagon.x+wagon.w/2,wagon.y+35*sc,19*sc,'#fff3aa','#223756')}else{drawCrate(drop.x,drop.y,clamp(W/540,.7,1),drop.num,drop.angle)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);else{ctx.globalAlpha=clamp(p.life*1.7,0,1);ellipse(p.x,p.y,rand(1,2.6),rand(1,2.6),p.color);ctx.globalAlpha=1}}if((phase==='wrong'||phase==='miss')&&t>=nextAt){phase='play';drop=null;crateResolved=false;const b=selected;b.dead=false;b.x=W+75;b.y=H*.30;selected=null}}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
